# Silences every SLF4J-routed log line in this module (Jetty's own server/connector
# logging, via the slf4j-simple binding declared in cloud-driver-plugin's pom.xml) - see
# DefaultRestFactory#silenceJavalinLogging. A classpath resource, not a runtime
# System.setProperty call, deliberately: slf4j-simple's SimpleLoggerConfiguration reads
# its properties exactly once, the first time any SLF4J logger in the whole JVM is
# created - by the time DefaultRestFactory#start runs (after the database connection,
# extensions, etc. have already had a chance to touch SLF4J), a runtime property set
# there could easily be too late to have any effect. A properties file on the classpath
# is already present before the JVM touches any class, so it can't lose that race.
org.slf4j.simpleLogger.defaultLogLevel=off
