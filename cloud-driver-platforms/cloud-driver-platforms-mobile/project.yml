name: CloudDriverMobile
options:
  bundleIdPrefix: de.lino.cloud
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
packages:
  # Folder upload (zip client-side, mirroring cloud-driver-platforms-desktop's own
  # FolderZipper.kt) and archive extraction need real ZIP read/write - unlike the JVM
  # (java.util.zip), Foundation has no built-in ZIP archive API. ZIPFoundation is a
  # well-established, MIT-licensed, pure-Swift package with no dependencies of its own.
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.20
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  CloudDriverMobile:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CloudDriverMobile
    dependencies:
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_NAME: CloudDriverMobile
        PRODUCT_BUNDLE_IDENTIFIER: de.lino.cloud.platform.mobile
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Cloud Driver"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
