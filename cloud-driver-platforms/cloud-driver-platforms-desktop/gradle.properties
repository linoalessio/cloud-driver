# Compose Desktop's jpackage-based packaging tasks (createDistributable, packageDmg, ...)
# refuse to run against a Homebrew-distributed JDK by default - it's flagged as a known source of
# packaging issues (https://github.com/JetBrains/compose-multiplatform/issues/3107), not because
# it's actually broken here. Verified working against this repo's toolchain (OpenJDK 21 via
# Homebrew) - disabling the vendor check rather than requiring a second, non-Homebrew JDK install
# just for packaging.
compose.desktop.packaging.checkJdkVendor=false
