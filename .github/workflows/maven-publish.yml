# This workflow will build a package using Maven and then publish it to GitHub packages when a release is created
# For more information see: https://github.com/actions/setup-java/blob/main/docs/advanced-usage.md#Publishing-using-Apache-Maven

name: Maven Package

on:
  release:
    types: [ created ]
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Configure Maven settings.xml
        # Written by hand, once, with both <server> entries in the same file - NOT via
        # actions/setup-java's server-id input called twice (one call per registry), which was
        # tried first and failed unpredictably both ways (confirmed via two real runs, 2026-09-06):
        # with overwrite-settings left at its default (true) on both calls, the *second* call
        # replaces settings.xml wholesale, discarding the first call's <server> entry entirely -
        # "github" 401'd while "database-driver-github" (the second call) worked. Setting
        # overwrite-settings: false on the second call to try to fix that instead made it skip
        # writing its own entry altogether once a settings.xml already existed - "github" (the
        # first call) then worked but "database-driver-github" 401'd. There is no combination of
        # setup-java calls that gets both entries into one file at once; writing the file directly
        # removes the ambiguity instead of guessing at setup-java's internal merge/replace
        # behavior again.
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'EOF'
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.GITHUB_TOKEN}</password>
              </server>
              <server>
                <id>database-driver-github</id>
                <username>${env.DATABASE_DRIVER_PACKAGES_ACTOR}</username>
                <password>${env.DATABASE_DRIVER_PACKAGES_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Build with Maven
        # Only needs database-driver-github credentials - dependency resolution reads from that
        # registry (root pom.xml's <repositories>) and Maven Central, never from the "github"
        # server (that one is a <distributionManagement> deploy target only, never a resolution
        # source).
        run: mvn -B package --file pom.xml
        env:
          DATABASE_DRIVER_PACKAGES_ACTOR: ${{ github.actor }}
          DATABASE_DRIVER_PACKAGES_TOKEN: ${{ secrets.DATABASE_DRIVER_PACKAGES_TOKEN }}

      - name: Publish to GitHub Packages Apache Maven
        # Deploys the whole reactor (every module under the root pom.xml's <modules>), since root
        # pom.xml's <distributionManagement> is inherited by all of them; cloud-driver-platforms-
        # desktop/-mobile are not Maven modules and are never touched by this workflow. Needs both
        # sets of credentials, since `deploy` re-runs the full lifecycle (including dependency
        # resolution against database-driver-github) before uploading to the "github" registry.
        run: mvn -B deploy --file pom.xml -DskipTests
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
          DATABASE_DRIVER_PACKAGES_ACTOR: ${{ github.actor }}
          # A personal access token (classic) with the read:packages scope, generated by an
          # account with access to linoalessio/database-driver-v2 and saved as a repository
          # secret named DATABASE_DRIVER_PACKAGES_TOKEN - the default GITHUB_TOKEN cannot read
          # packages from a different repository, so this cannot use github.token/secrets.GITHUB_TOKEN.
          DATABASE_DRIVER_PACKAGES_TOKEN: ${{ secrets.DATABASE_DRIVER_PACKAGES_TOKEN }}
