# This workflow will build a package using Maven and then publish it to GitHub packages when a release is created
# For more information see: https://github.com/actions/setup-java/blob/main/docs/advanced-usage.md#Publishing-using-Apache-Maven

name: Maven Package

on:
  release:
    types: [ created ]
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: github # Matches the id of the <repository> under root pom.xml's <distributionManagement>

      - name: Configure GitHub Packages credentials for database-driver-v2
        # Every module here depends on de.lino.database:database-driver-api/-plugin, published to
        # linoalessio/database-driver-v2's own GitHub Packages registry (see root pom.xml's
        # <repositories>), not Maven Central - and reading from GitHub Packages always requires
        # authentication, even for a public package, and the "github" server configured just above
        # (backed by this run's own GITHUB_TOKEN) can only read packages belonging to *this*
        # repository, not a different one. This second setup-java call appends a matching
        # <server id="database-driver-github"> entry to the same ~/.m2/settings.xml the step above
        # already started - setup-java supports being called more than once per job for exactly
        # this, one registry's credentials per call.
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: database-driver-github
          server-username: DATABASE_DRIVER_PACKAGES_ACTOR
          server-password: DATABASE_DRIVER_PACKAGES_TOKEN

      - name: Build with Maven
        run: mvn -B package --file pom.xml
        env:
          DATABASE_DRIVER_PACKAGES_ACTOR: ${{ github.actor }}
          # See the matching env var on the deploy step below for what this must be.
          DATABASE_DRIVER_PACKAGES_TOKEN: ${{ secrets.DATABASE_DRIVER_PACKAGES_TOKEN }}

      - name: Publish to GitHub Packages Apache Maven
        # setup-java's server-id above already wrote a ~/.m2/settings.xml mapping the "github"
        # server to $GITHUB_ACTOR/$GITHUB_TOKEN, which Maven reads automatically - no -s flag or
        # committed settings.xml needed. Deploys the whole reactor (every module under the root
        # pom.xml's <modules>), since root pom.xml's <distributionManagement> is inherited by all
        # of them; cloud-driver-platforms-desktop/-mobile are not Maven modules and are never
        # touched by this workflow. Still needs the database-driver-github credentials too, since
        # `deploy` re-runs the full lifecycle (including dependency resolution) from scratch.
        run: mvn -B deploy --file pom.xml -DskipTests
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DATABASE_DRIVER_PACKAGES_ACTOR: ${{ github.actor }}
          # A personal access token (classic) with the read:packages scope, generated by an
          # account with access to linoalessio/database-driver-v2 and saved as a repository
          # secret named DATABASE_DRIVER_PACKAGES_TOKEN - the default GITHUB_TOKEN cannot read
          # packages from a different repository, so this cannot use github.token/secrets.GITHUB_TOKEN.
          DATABASE_DRIVER_PACKAGES_TOKEN: ${{ secrets.DATABASE_DRIVER_PACKAGES_TOKEN }}
