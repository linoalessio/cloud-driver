# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  push:
    branches: [ "master" ]
    paths-ignore:
      - 'cloud-driver-platforms/cloud-driver-platforms-desktop/**'
      - 'cloud-driver-platforms/cloud-driver-platforms-mobile/**'
      - 'cloud-driver-multiplatform/cloud-driver-multiplatform-python/**'
      - 'cloud-driver-multiplatform/cloud-driver-multiplatform-swift/**'
      - '**/*.md'
      - '.github/workflows/swift.yml'
      - '.github/workflows/python.yml'
  pull_request:
    branches: [ "master" ]
    paths-ignore:
      - 'cloud-driver-platforms/cloud-driver-platforms-desktop/**'
      - 'cloud-driver-platforms/cloud-driver-platforms-mobile/**'
      - 'cloud-driver-multiplatform/cloud-driver-multiplatform-python/**'
      - 'cloud-driver-multiplatform/cloud-driver-multiplatform-swift/**'
      - '**/*.md'
      - '.github/workflows/swift.yml'
      - '.github/workflows/python.yml'
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Configure GitHub Packages credentials for database-driver-v2
        # Every module here depends on de.lino.database:database-driver-api/-plugin, published to
        # linoalessio/database-driver-v2's own GitHub Packages registry (see root pom.xml's
        # <repositories>), not Maven Central - and reading from GitHub Packages always requires
        # authentication, even for a public package, and the automatic GITHUB_TOKEN below can only
        # read packages belonging to *this* repository, not a different one. This second
        # setup-java call appends a matching <server id="database-driver-github"> entry to the
        # same ~/.m2/settings.xml the JDK-setup step above already started (setup-java supports
        # being called more than once per job for exactly this - one registry's credentials per
        # call), reading its username/token from the env vars set on the build step below.
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: database-driver-github
          server-username: DATABASE_DRIVER_PACKAGES_ACTOR
          server-password: DATABASE_DRIVER_PACKAGES_TOKEN

      - name: Build with Maven
        # Root pom.xml is a multi-module reactor - this reaches every Java module
        # (cloud-driver-api/-auth/-plugin/-bootstrap/-extensions*/cloud-driver-multiplatform-java)
        # in one dependency-ordered build. cloud-driver-platforms-desktop (Gradle/Kotlin),
        # cloud-driver-platforms-mobile (Xcode/Swift), cloud-driver-multiplatform-swift (a plain
        # SPM package), and cloud-driver-multiplatform-python (pip) are deliberately not Maven
        # modules and are never touched here - see swift.yml/python.yml for those modules' own CI
        # builds (also why both are excluded from this workflow's own `paths-ignore` above,
        # alongside the two directories themselves).
        run: mvn -B package --file pom.xml
        env:
          DATABASE_DRIVER_PACKAGES_ACTOR: ${{ github.actor }}
          # A personal access token (classic) with the read:packages scope, generated by an
          # account with access to linoalessio/database-driver-v2 and saved as a repository
          # secret named DATABASE_DRIVER_PACKAGES_TOKEN - the default GITHUB_TOKEN cannot read
          # packages from a different repository, so this cannot use github.token/secrets.GITHUB_TOKEN.
          DATABASE_DRIVER_PACKAGES_TOKEN: ${{ secrets.DATABASE_DRIVER_PACKAGES_TOKEN }}
