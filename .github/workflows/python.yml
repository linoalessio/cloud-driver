# This workflow installs cloud-driver-python and runs its test suite.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python

on:
  push:
    branches: [ "master" ]
    paths:
      - 'cloud-driver-python/**'
      - '.github/workflows/python.yml'
  pull_request:
    branches: [ "master" ]
    paths:
      - 'cloud-driver-python/**'
      - '.github/workflows/python.yml'
  workflow_dispatch:

# cloud-driver-python (package name cloud-driver-client) is a plain, dependency-free-of-this-repo
# Python SDK (hatchling build backend) - not a Maven module, not touched by mvn/maven.yml at all.
# Its own test suite (tests/test_client.py) mocks the server via respx, so this needs no live
# server/database - matching the "package install + pytest" shape every other pure-Python CI
# workflow uses. See cloud-driver-python/README.md and the root CLAUDE.md's own
# "cloud-driver-python" section for the full picture.

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: cloud-driver-python

    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.11", "3.12" ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: cloud-driver-python/pyproject.toml

      - name: Install cloud-driver-python (with dev extras)
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v
