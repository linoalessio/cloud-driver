[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cloud-driver-installer"
version = "1.0.7"
description = "Desktop GUI that installs and configures the whole cloud-driver system on a root server over SSH: OS packages, PostgreSQL, Redis, ClamAV, Java, Python, the AWS KMS/S3/IAM/SES resources, Caddy, the config files, the application jars and the intelligence service."
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Lino Alessio Kauschinger" }]
dependencies = [
    # SSH/SFTP transport. Everything the installer does on the server goes through one paramiko
    # session; ssh-config aliases (e.g. the reference deployment's `cloud_driver`) are resolved
    # with paramiko's own SSHConfig parser.
    "paramiko>=3.4,<4",
    # The AWS-side provisioning (KMS key + alias, S3 bucket, least-privilege IAM user, SES
    # identity) runs LOCALLY with the operator's own credentials; only the created IAM user's
    # access key ever reaches the server.
    "boto3>=1.34,<2",
]

[project.optional-dependencies]
# The GUI itself is tkinter (standard library) and needs no extra package - on Debian/Ubuntu
# operator machines install the OS package `python3-tk` if `import tkinter` fails.
dev = ["pytest>=8"]

[project.scripts]
cloud-driver-installer = "cloud_driver_installer.gui.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cloud_driver_installer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Python 3.14 ignores .pth files whose name starts with "_" (hatchling's editable hook is one), so an
# editable install is invisible there; the explicit source path keeps `pytest` working regardless.
pythonpath = ["src", "tests"]
